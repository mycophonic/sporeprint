name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for git-validation

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install dependencies
        run: |
          make init-dev

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -qq cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Build Chromaprint
        run: make chromaprint

      - name: Lint
        env:
          LINT_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || 'main..HEAD' }}
        run: make lint

  lint-success:
    name: Lint
    if: always()
    needs: [lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint matrix results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint matrix failed: ${{ needs.lint.result }}"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -qq cmake ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg-full

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw -y
          /c/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-ffmpeg

      - name: Build Chromaprint
        run: make chromaprint

      - name: Run tests
        run: make test

  test-success:
    name: Test
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed: ${{ needs.test.result }}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -qq cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Build binary
        run: make build

      - name: Verify binary
        run: make verify

  build-success:
    name: Build
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check build matrix results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build matrix failed: ${{ needs.build.result }}"
            exit 1
          fi
